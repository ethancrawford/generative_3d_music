<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative 3D Music</title>
    <link rel="stylesheet" href="/src/styles/main.scss">
</head>
<body>
    <div id="canvas-container">
        <div id="ui-overlay">
            <div class="ui-panel"
                 data-controller="mode"
                 data-mode-current-value="user">
                <div class="mode-toggle">
                    <span>Mode:</span>
                    <button id="user-mode-btn"
                            data-action="mode#selectUser"
                            data-mode-target="userButton"
                            class="toggle-button active">User</button>
                    <button id="generative-mode-btn"
                            data-action="mode#selectGenerative"
                            data-mode-target="generativeButton"
                            class="toggle-button">Generative</button>
                </div>
            </div>

            <div class="ui-panel"
                 data-controller="primitives"
                 data-primitives-selected-value="cube">
                <h3 style="margin-bottom: 10px;">Primitives</h3>
                <div class="primitives-menu">
                    <div class="primitive-button"
                         data-primitive="cube"
                         data-action="primitives#select"
                         data-primitives-target="button">
                      <div class="primitive-icon">⬛</div>
                      <div class="primitive-label">Cube</div>
                    </div>
                    <div class="primitive-button"
                         data-primitive="sphere"
                         data-action="primitives#select"
                         data-primitives-target="button">
                      <div class="primitive-icon">⚫</div>
                      <div class="primitive-label">Sphere</div>
                    </div>
                    <div class="primitive-button"
                         data-primitive="cylinder"
                         data-action="primitives#select"
                         data-primitives-target="button">
                      <div class="primitive-icon">⬜</div>
                      <div class="primitive-label">Cylinder</div>
                    </div>
                    <div class="primitive-button"
                         data-primitive="cone"
                         data-action="primitives#select"
                         data-primitives-target="button">
                      <div class="primitive-icon">🔺</div>
                      <div class="primitive-label">Cone</div>
                    </div>
                    <div class="primitive-button"
                         data-primitive="torus"
                         data-action="primitives#select"
                         data-primitives-target="button">
                      <div class="primitive-icon">⭕</div>
                      <div class="primitive-label">Torus</div>
                    </div>
                </div>
            </div>

            <div class="ui-panel status-panel"
                 data-controller="status">
                <h3 style="margin-bottom: 10px;">Status</h3>
                <div class="status-item">
                  <span>World:</span>
                  <label class="toggle-switch">
                    <input type="checkbox"/>
                    <span class="slider"></span>
                  </label>
                </div>
                <div class="status-item">
                  <span>OSC Connection:</span>
                  <div class="status-indicator"
                       id="osc-status"
                       data-status-target="oscStatus"></div>
                </div>
                <div class="status-item">
                    <span>Objects:</span>
                    <span id="object-count"
                          data-status-target="objectCount">0</span>
                </div>
                <div class="status-item">
                    <span>Messages Sent:</span>
                    <span id="message-count"
                          data-status-target="messageCount">0</span>
                </div>
            </div>
        </div>

        <div id="info-panel">
            <strong>Controls:</strong><br>
            • Left click: Place selected primitive<br>
            • Right click: Remove object<br>
            • Mouse wheel: Zoom<br>
            • Drag: Rotate view<br>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>

</body>
</html>
