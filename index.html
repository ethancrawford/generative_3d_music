<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative 3D Music</title>
    <link rel="stylesheet" href="/src/styles/main.scss">
</head>
<body>
    <div id="canvas-container">
        <div id="ui-overlay">
            <div class="ui-panel">
                <div class="mode-toggle">
                    <span>Mode:</span>
                    <button id="user-mode-btn" class="toggle-button active">User</button>
                    <button id="generative-mode-btn" class="toggle-button">Generative</button>
                </div>
            </div>

            <div class="ui-panel">
                <h3 style="margin-bottom: 10px;">Primitives</h3>
                <div class="primitives-menu">
                    <div class="primitive-button" data-primitive="cube">
                        <div class="primitive-icon">⬛</div>
                        <div class="primitive-label">Cube</div>
                    </div>
                    <div class="primitive-button" data-primitive="sphere">
                        <div class="primitive-icon">⚫</div>
                        <div class="primitive-label">Sphere</div>
                    </div>
                    <div class="primitive-button" data-primitive="cylinder">
                        <div class="primitive-icon">⬜</div>
                        <div class="primitive-label">Cylinder</div>
                    </div>
                    <div class="primitive-button" data-primitive="cone">
                        <div class="primitive-icon">🔺</div>
                        <div class="primitive-label">Cone</div>
                    </div>
                    <div class="primitive-button" data-primitive="torus">
                        <div class="primitive-icon">⭕</div>
                        <div class="primitive-label">Torus</div>
                    </div>
                </div>
            </div>

            <div class="ui-panel status-panel">
                <h3 style="margin-bottom: 10px;">Status</h3>
                <div class="status-item">
                  <span>World:</span>
                  <label class="toggle-switch">
                    <input type="checkbox"/>
                    <span class="slider"></span>
                  </label>
                </div>
                <div class="status-item">
                  <span>OSC Connection:</span>
                  <div class="status-indicator" id="osc-status"></div>
                </div>
                <div class="status-item">
                    <span>Objects:</span>
                    <span id="object-count">0</span>
                </div>
                <div class="status-item">
                    <span>Messages Sent:</span>
                    <span id="message-count">0</span>
                </div>
            </div>
        </div>

        <div id="info-panel">
            <strong>Controls:</strong><br>
            • Left click: Place selected primitive<br>
            • Right click: Remove object<br>
            • Mouse wheel: Zoom<br>
            • Drag: Rotate view<br>
            <br>
            <strong>Current Mode:</strong> <span id="current-mode">User</span><br>
            <strong>Selected:</strong> <span id="selected-primitive">Cube</span>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>

</body>
</html>
